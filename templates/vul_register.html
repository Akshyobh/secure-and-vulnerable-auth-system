{% extends "vul_base.html" %}
{% block title %}
Register
{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h2 class="text-center mb-4">
                Registration
            </h2>
            {% if success %}
            <div class="alert alert-success">
                {{ success }}
            </div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        Name
                    </label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        class="form-control"
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Phone Number
                    </label>
                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        class="form-control"
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Username
                    </label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                    >
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="registerPassword"
                        class="form-control"
                    >
                    <div class="form-check mt-2">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showRegisterPassword"
                        >
                        <label
                            class="form-check-label"
                            for="showRegisterPassword"
                        >
                            Show Password
                        </label>
                    </div>
                </div>
                <div class="d-grid">
                    <input
                        type="submit"
                        value="Submit"
                        class="btn btn-success"
                    >
                </div>
            </form>
            <hr>
            <div class="text-center">
                <a href="/" class="btn btn-secondary">
                    Home
                </a>
                <a href="/login" class="btn btn-primary">
                    Go to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
