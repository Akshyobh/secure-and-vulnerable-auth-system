{% extends "base.html" %}
{% block title %}
Register
{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h2 class="text-center mb-4">
                Registration
            </h2>
            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">
                {{ success }}
            </div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        Name
                    </label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        id="name"
                        required
                    >
                    <small id="nameMessage" class="text-muted"></small>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    <small id="emailMessage" class="text-muted"></small>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Phone Number
                    </label>
                    <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-control"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                            >
                        <small id="phoneMessage" class="text-muted"></small>
                    </div>
                <div class="mb-3">
                    <label class="form-label">
                        Username
                    </label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        pattern="[A-Za-z0-9_]{4,20}"
                        id="username"
                        required
                    >
                    <small id="usernameMessage" class="text-muted"></small>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>
                    <div class="mb-3">
                    <input
                        type="password"
                        name="password"
                        id="registerPassword"
                        class="form-control"
                        minlength="8"
                        required
                    >
                    <small id="passwordMessage" class="text-muted"></small>
                    <div class="form-check mt-2">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showRegisterPassword"
                        >

                        <label
                            class="form-check-label"
                            for="showRegisterPassword"
                        >
                            Show Password
                        </label>

                    </div>
                </div>
                </div>
                <div class="d-grid">
                    <input
                        type="submit"
                        value="Submit"
                        class="btn btn-success"
                    >
                </div>
            </form>
            <hr>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-secondary">
                    Home
                </a>
                <a href="/login" class="btn btn-primary">
                    Go to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
