{% extends "vul_base.html" %}
{% block title %}
Application Form
{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 900px;">
        <div class="card-body">
            <h2 class="text-center mb-4">
                Application Form
            </h2>
            {% if success %}
            <div class="alert alert-success">
                {{ success }}
            </div>
            {% endif %}
            <form method="POST">
                <h4 class="mb-3">
                    Personal Information
                </h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Name
                            </label>
                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ form_data[1] if form_data else user_data[0] }}"
                            >
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                DOB
                            </label>
                            <input
                                type="text"
                                name="dob"
                                class="form-control"
                                value="{{ form_data[2] if form_data else '' }}"
                            >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>
                            <input
                                type="text"
                                name="email"
                                class="form-control"
                                value="{{ form_data[3] if form_data else user_data[1] }}"
                            >
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Phone Number
                            </label>
                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ form_data[4] if form_data else user_data[2] }}"
                            >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Gender
                            </label>
                            <input
                                type="text"
                                name="gender"
                                class="form-control"
                                value="{{ form_data[5] if form_data else '' }}"
                            >
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                DOJ
                            </label>
                            <input
                                type="text"
                                name="doj"
                                class="form-control"
                                value="{{ form_data[7] if form_data else '' }}"
                            >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                DOC
                            </label>
                            <input
                                type="text"
                                name="doc"
                                class="form-control"
                                value="{{ form_data[8] if form_data else '' }}"
                            >
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Address
                    </label>
                    <textarea
                        name="address"
                        rows="4"
                        class="form-control"
                    >{{ form_data[6] if form_data else '' }}</textarea>
                </div>
                <h4 class="mt-4 mb-3">
                    Academic Information
                </h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Institute Name
                            </label>
                            <input
                                type="text"
                                name="institute"
                                class="form-control"
                                value="{{ form_data[9] if form_data else '' }}"
                            >
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">
                                Branch
                            </label>
                            <input
                                type="text"
                                name="branch"
                                class="form-control"
                                value="{{ form_data[10] if form_data else '' }}"
                            >
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-4">
                            <label class="form-label">
                                CGPA
                            </label>
                            <input
                                type="text"
                                name="cgpa"
                                class="form-control"
                                value="{{ form_data[11] if form_data else '' }}"
                            >
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button
                        type="submit"
                        class="btn btn-success">
                        Update
                    </button>
                    <a
                        href="/welcome"
                        class="btn btn-secondary">
                        Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
